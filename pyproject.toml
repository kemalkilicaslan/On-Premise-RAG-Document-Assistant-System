[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docrag"
version = "0.1.0"
description = "On-premise RAG document assistant: Ollama LLM and embeddings, PostgreSQL + pgvector retrieval, FastAPI with JWT and role-based access control."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-NC-ND-4.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "pydantic-settings>=2.7",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "httpx>=0.28",
    "pypdf>=5.1",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "numpy>=1.26"]
eval = ["numpy>=1.26"]
figures = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependencies are declared as argument defaults by design
"src/docrag/routers/*" = ["B008"]
"src/docrag/security.py" = ["B008"]
